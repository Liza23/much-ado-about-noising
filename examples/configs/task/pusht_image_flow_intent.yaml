# @package task
defaults:
  - pusht_image
  - _self_

# Config A: flow model predicts 2D agent position intent, MLP decodes actions.
# Intent = mean future agent position over next intent_horizon steps (GT at train, flow sample at eval).
intent_conditioning: true
intent_dim: 2           # agent_x, agent_y
intent_indices: [0, 1]  # indices in 5D state: [agent_x, agent_y, ...]
intent_type: mean
intent_predictor: false
intent_horizon: 8
intent_training_mode: independent
