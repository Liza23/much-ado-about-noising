# @package task
defaults:
  - lift_mh_state
  - _self_

# Config A (flow intent, raw mean intent) — lift-mh task.
#
# Same as lift_ph_state_flow_intent.yaml but on multi-human demos.
# Uses raw 7D mean eef pos+quat as intent (no encoder).
intent_conditioning: true
intent_dim: 7
intent_type: mean
intent_predictor: false
intent_horizon: 8
intent_training_mode: independent
