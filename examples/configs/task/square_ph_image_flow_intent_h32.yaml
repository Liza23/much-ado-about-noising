# @package task
defaults:
  - square_ph_image
  - _self_

# Config A (flow intent, raw 7D mean intent) with longer intent horizon — square-ph image.
# Same as square_ph_image_flow_intent.yaml but intent_horizon=32 (4x longer lookahead).
# Action execution is still act_steps=8; only the intent extraction window is wider.
intent_conditioning: true
intent_dim: 7
intent_type: mean
intent_predictor: false
intent_horizon: 32
intent_training_mode: independent
