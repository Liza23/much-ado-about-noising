# @package task
# LIBERO-10 suite — flow-intent Config A
#
# Same architecture as libero_spatial_state_flow_intent but for the LIBERO-10
# benchmark (different task names, same obs/action structure).
defaults:
  - libero_10_state
  - _self_

# Intent settings — 6D = ee_pos(3) + axis-angle(3)
intent_conditioning: true
intent_dim: 6
intent_type: mean
intent_predictor: false
intent_horizon: 8
intent_training_mode: independent
intent_keys:
  - ee_states
