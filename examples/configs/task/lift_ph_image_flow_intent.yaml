# @package task
defaults:
  - lift_ph_image
  - _self_

# Config A (flow intent) — image observations, raw 7D intent.
#
# FlowIntentAgent: shared encoder processes image + lowdim obs, then
# a flow model generates 7D intent (eef_pos + quat), and an MLP action
# decoder maps (obs_emb, intent) → action.
#
# No "intent" key added to shape_meta — FlowIntentAgent handles intent
# internally via its flow model; obs is passed as-is (no intent appended).
#
# Compare against:
#   lift_ph_image.yaml                    — baseline (no intent)
#   lift_ph_image_hierarchical_emb.yaml   — Config B (MLP predictor, 64D intent)
#   lift_ph_state_flow_intent.yaml        — same architecture, state obs
intent_conditioning: true
intent_dim: 7
intent_type: mean
intent_predictor: false   # Config A: no standalone MLP predictor
intent_horizon: 8
intent_training_mode: independent
