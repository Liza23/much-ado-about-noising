# @package task
defaults:
  - square_ph_state
  - _self_

# Config A (flow intent) with encoded-mean intent + encoder warmup — square-ph.
#
# Square is a harder task with more rotation variety, so quaternion mean is
# especially problematic. Encoded mean + freeze gives a well-defined stable intent space.
#
# Compare against:
#   square_ph_state_flow_intent_emb.yaml  — Config A with encoded_mean (no freeze)
#   square_ph_state_hierarchical_emb_warmup.yaml — Config B with encoded_mean + freeze
intent_conditioning: true
intent_dim: 7
intent_type: mean
intent_predictor: false
intent_horizon: 8
intent_training_mode: independent
intent_encoder_warmup_steps: 50000
